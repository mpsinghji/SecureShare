services:
  - type: web
    name: secureshare-backend
    env: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false # Set this in Render Dashboard to your Vercel URL
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard (Supabase PostgreSQL Connection URI)
      - key: SUPABASE_URL
        sync: false # Set this in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set this in Render Dashboard
      - key: JWT_SECRET
        sync: false # Set this in Render Dashboard
